<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">资料类型与操作边界</title>
<desc id="desc">预览和编辑能力按文件类型区分，避免把只读资料当作可编辑文档。结构/流程示意，不是界面截图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8298af"/></marker></defs>
<rect width="1400" height="760" fill="#f7f9fc"/>
<text x="74" y="78" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#173f6b">资料类型与操作边界</text>
<text x="76" y="121" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#52667c">预览和编辑能力按文件类型区分，避免把只读资料当作可编辑文档</text>
<rect x="1002" y="142" width="322" height="42" rx="21" fill="#e8eef6"/>
<text x="1163" y="170" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#4b6076">结构/流程示意 · 非界面截图</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><circle cx="274.0" cy="526" r="5" fill="#3478c9"/><circle cx="700.0" cy="526" r="5" fill="#159a9a"/><circle cx="1126.0" cy="526" r="5" fill="#df9b26"/><g class="card" data-card="Markdown"><rect data-frame="true" x="76" y="222" width="396" height="286" rx="22" fill="#eaf2ff" stroke="#3478c9" stroke-width="2"/><rect x="76" y="222" width="396" height="12" rx="6" fill="#3478c9"/><text x="274.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#174b83"><tspan x="274.0" dy="0">Markdown</tspan></text><text x="274.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="274.0" dy="0">应用内只读</tspan><tspan x="274.0" dy="30">提供原文查看</tspan><tspan x="274.0" dy="30">不保存编辑</tspan></text></g><g class="card" data-card="普通文本"><rect data-frame="true" x="502" y="222" width="396" height="286" rx="22" fill="#e7f7f6" stroke="#159a9a" stroke-width="2"/><rect x="502" y="222" width="396" height="12" rx="6" fill="#159a9a"/><text x="700.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#176a70"><tspan x="700.0" dy="0">普通文本</tspan></text><text x="700.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="700.0" dy="0">支持编辑草稿</tspan><tspan x="700.0" dy="30">自动保存草稿</tspan><tspan x="700.0" dy="30">检测保存冲突</tspan></text></g><g class="card" data-card="媒体与数据"><rect data-frame="true" x="928" y="222" width="396" height="286" rx="22" fill="#fff4df" stroke="#df9b26" stroke-width="2"/><rect x="928" y="222" width="396" height="12" rx="6" fill="#df9b26"/><text x="1126.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#87520d"><tspan x="1126.0" dy="0">媒体与数据</tspan></text><text x="1126.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="1126.0" dy="0">PDF 与图片预览</tspan><tspan x="1126.0" dy="30">JSON / CSV 预览</tspan><tspan x="1126.0" dy="30">部分格式可编辑</tspan></text></g></g>
<rect x="76" y="552" width="1248" height="98" rx="18" fill="#ffffff" stroke="#d7e1eb" stroke-width="2"/>
<circle cx="108" cy="601" r="9" fill="#159a9a"/>
<text x="700" y="588" text-anchor="middle" font-size="22" font-weight="500" fill="#3e5267"><tspan x="700" dy="0">具体编辑入口取决于格式；预览不等于修改源文件。</tspan></text>
<text x="76" y="710" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#73869a">Silverwing 知识库 · 基于当前代码与已实现功能</text>
