<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Silverwing 程序文件、用户数据和外部工具</title>
  <desc id="desc">结构示意图：程序目录保存 silverwing.exe、原生资源和许可证；用户数据包含默认 Silverwing home、任务根和可选资料根；Git、IDE、Codex、Meegle 等工具根据需要配置。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#547A9D"/></marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#138A9B"/></marker>
  </defs>
  <rect width="1400" height="860" fill="#F4F8FC"/>
  <text x="70" y="76" fill="#173858" font-size="38" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">安装文件与本机数据各自存放</text>
  <text x="70" y="118" fill="#526B82" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">应用负责管理工作区和上下文；代码仓库及开发工具由你选择位置与版本。</text>
  <rect x="1024" y="48" width="306" height="48" rx="24" fill="#E7EEF6"/>
  <text x="1177" y="80" text-anchor="middle" fill="#486580" font-size="22" font-weight="600" font-family="Segoe UI, Microsoft YaHei, sans-serif">结构示意 · 非界面截图</text>

  <rect x="60" y="180" width="610" height="420" rx="22" fill="#FFFFFF" stroke="#8DAECC" stroke-width="2"/>
  <rect x="60" y="180" width="610" height="14" rx="7" fill="#3375B8"/>
  <text x="95" y="245" fill="#173858" font-size="30" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">程序目录</text>
  <text x="95" y="284" fill="#526B82" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">安装位置或完整解压后的 silverwing/ 文件夹</text>
  <rect x="95" y="315" width="540" height="62" rx="14" fill="#EEF5FC"/>
  <text x="122" y="354" fill="#285F95" font-size="25" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">silverwing.exe</text>
  <text x="386" y="354" fill="#38536C" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">桌面应用入口</text>
  <rect x="95" y="392" width="540" height="90" rx="14" fill="#EEF5FC"/>
  <text x="122" y="429" fill="#285F95" font-size="25" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">resources/</text>
  <text x="282" y="429" fill="#38536C" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">PDFium · native-mermaid</text>
  <text x="122" y="463" fill="#38536C" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">本机 PDF 与 Mermaid 渲染资源</text>
  <rect x="95" y="497" width="230" height="58" rx="14" fill="#EEF5FC"/>
  <text x="122" y="534" fill="#285F95" font-size="24" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">许可文件</text>
  <text x="350" y="534" fill="#38536C" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">resources/licenses/</text>
  <text x="95" y="582" fill="#147A88" font-size="23" font-weight="600" font-family="Segoe UI, Microsoft YaHei, sans-serif">运行安装版无需另装 Go 或 JVM</text>

  <path d="M680 390 H712" fill="none" stroke="#547A9D" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="696" y="370" text-anchor="middle" fill="#526B82" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">读取</text>

  <rect x="725" y="180" width="615" height="420" rx="22" fill="#FFFFFF" stroke="#79BFC6" stroke-width="2"/>
  <rect x="725" y="180" width="615" height="14" rx="7" fill="#138A9B"/>
  <text x="760" y="245" fill="#173858" font-size="30" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">用户数据与任务文件</text>
  <rect x="760" y="274" width="545" height="88" rx="14" fill="#F1FAFB"/>
  <text x="788" y="309" fill="#145E6A" font-size="24" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">默认 home</text>
  <text x="788" y="344" fill="#38536C" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">~/silverwing · 配置与本机状态</text>
  <rect x="760" y="376" width="545" height="88" rx="14" fill="#F1FAFB"/>
  <text x="788" y="411" fill="#145E6A" font-size="24" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">默认任务根</text>
  <text x="788" y="446" fill="#38536C" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">~/tasks · 每个任务一个独立目录</text>
  <rect x="760" y="478" width="545" height="88" rx="14" fill="#F1FAFB"/>
  <text x="788" y="513" fill="#145E6A" font-size="24" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">资料根</text>
  <text x="788" y="548" fill="#38536C" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">可单独配置；可与任务根分开存放</text>

  <rect x="60" y="650" width="1280" height="150" rx="22" fill="#FFF9EA" stroke="#E2B65C" stroke-width="2"/>
  <text x="95" y="696" fill="#805914" font-size="27" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">按需安装与配置的本机工具</text>
  <rect x="120" y="718" width="260" height="56" rx="15" fill="#FFFFFF" stroke="#E2B65C"/>
  <text x="250" y="754" text-anchor="middle" fill="#76561B" font-size="23" font-weight="600" font-family="Segoe UI, Microsoft YaHei, sans-serif">Git</text>
  <rect x="420" y="718" width="260" height="56" rx="15" fill="#FFFFFF" stroke="#E2B65C"/>
  <text x="550" y="754" text-anchor="middle" fill="#76561B" font-size="23" font-weight="600" font-family="Segoe UI, Microsoft YaHei, sans-serif">IDE / Codex</text>
  <rect x="720" y="718" width="260" height="56" rx="15" fill="#FFFFFF" stroke="#E2B65C"/>
  <text x="850" y="754" text-anchor="middle" fill="#76561B" font-size="23" font-weight="600" font-family="Segoe UI, Microsoft YaHei, sans-serif">Meegle CLI</text>
  <rect x="1020" y="718" width="260" height="56" rx="15" fill="#FFFFFF" stroke="#E2B65C"/>
  <text x="1150" y="754" text-anchor="middle" fill="#76561B" font-size="23" font-weight="600" font-family="Segoe UI, Microsoft YaHei, sans-serif">飞书 CLI（可选）</text>
</svg>
