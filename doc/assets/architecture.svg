  <rect x="60" y="160" width="355" height="12" rx="6" fill="#3375B8"/>
  <text x="92" y="212" fill="#173858" font-size="27" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">MyGO UI / desktop</text>
  <text x="92" y="252" fill="#38536C" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">窗口、输入与界面状态</text>
  <text x="92" y="282" fill="#526B82" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">原生桌面绘制</text>

  <path d="M423 226 H516" fill="none" stroke="#547A9D" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="525" y="160" width="355" height="135" rx="20" fill="#FFFFFF" stroke="#8DAECC" stroke-width="2"/>
  <rect x="525" y="160" width="355" height="12" rx="6" fill="#3375B8"/>
  <text x="557" y="212" fill="#173858" font-size="27" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">application</text>
  <text x="557" y="252" fill="#38536C" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">Snapshot 读取界面状态</text>
  <text x="557" y="282" fill="#38536C" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">Dispatch 协调用户操作</text>

  <path d="M888 226 H981" fill="none" stroke="#547A9D" stroke-width="3" marker-end="url(#arrow)"/>

