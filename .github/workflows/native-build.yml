name: Native builds and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  version:
    name: Check product version
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag against product version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('internal/domain/models.go').read_text(encoding='utf-8')
          version = re.search(r'CurrentProductVersion\s*=\s*"(\d+\.\d+\.\d+)"', source).group(1)
          ref = os.environ['GITHUB_REF']
          release = os.environ['GITHUB_EVENT_NAME'] == 'push' and ref.startswith('refs/tags/')
          if release and ref != 'refs/tags/v' + version:
              raise SystemExit(f'Release tag must be v{version}, got {ref}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'release={str(release).lower()}\n')
          PY

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            platform: windows-x64
          - name: macOS Apple silicon
            runner: macos-26
            platform: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            third_party/mygo/go.sum

      - name: Install pinned NSIS for release installers
        if: matrix.platform == 'windows-x64' && needs.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # SourceForge's registered mirror from its official download page
          # (the /download endpoint returns HTML). SHA-256: winget catalog
          # manifests/n/NSIS/NSIS/3.13/NSIS.NSIS.installer.yaml
          $installer = Join-Path $env:RUNNER_TEMP 'nsis-3.13-setup.exe'
          @'
          import pathlib, sys, urllib.request
          with urllib.request.urlopen('https://twds.dl.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-setup.exe', timeout=60) as response:
              pathlib.Path(sys.argv[1]).write_bytes(response.read())
          '@ | python - $installer
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed.' }
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'NSIS download is not an EXE.' }
          $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($sha -ne 'DB9A1038BBC0E53FEF24F423FD609979BD578E942F1BE1198DB186D1C42652A3') {
              throw 'NSIS 3.13 installer SHA-256 mismatch.'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          # windows-2025 supplies WiX 3.14.1.8722; build-windows.ps1
          # checks heat/candle/light versions before creating the MSI.

      - name: Build Windows GUI and native resources
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          BUILD_RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if ($env:BUILD_RELEASE -eq 'true') {
              ./scripts/build-windows.ps1 -NSISPath "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          } else {
              ./scripts/build-windows.ps1 -PortableOnly
          }
          $files = @(Get-ChildItem 'build/native-release/windows-amd64/*/*' -File | Where-Object { $_.Extension -in '.zip', '.exe', '.msi' })
          $expected = if ($env:BUILD_RELEASE -eq 'true') { 3 } else { 1 }
          if ($files.Count -ne $expected) { throw "Expected $expected Windows packages, got $($files.Count)" }
          $null = New-Item -ItemType Directory -Path 'dist/windows-x64'
          $files | Copy-Item -Destination 'dist/windows-x64'

      - name: Build macOS app and DMG
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          bash ./scripts/build-macos.sh
          mkdir -p dist/macos-arm64
          cp build/native-release/macos-arm64/*/*.dmg dist/macos-arm64/

      - name: Upload platform packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silverwing-${{ matrix.platform }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish complete GitHub Release
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && github.repository == 'javatoai/silverwing'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect this run's successful platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: silverwing-*-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/release
          merge-multiple: true
      - name: Verify all assets, upload draft, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ./scripts/publish-release.py dist/release
