name: silverwing release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          product_version=$(sed -n 's/.*version *= *"\([^"]*\)".*/\1/p' build.gradle.kts | head -n1)
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$product_version"
          test "$tag_version" = "$product_version" || {
            echo "Release tag $GITHUB_REF_NAME does not match product version $product_version" >&2
            exit 1
          }
      - name: Compile desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean :desktop:compileKotlin
      - name: Compile desktop (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          perl -pi -e 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew clean :desktop:compileKotlin

  prepare-release:
    name: Prepare draft release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Packages are uploaded straight to the draft release instead of
      # actions/upload-artifact: artifact storage is metered per account and a
      # single release already fills the free allowance, while release assets are not.
      - name: Create draft release ${{ github.ref_name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '"tag ref: \(.ref)"'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
          else
            notes=$(mktemp)
            printf '自动构建 silverwing 桌面产物。\n\n- **Windows**：绿色 portable zip、Setup EXE、MSI\n- **macOS**：DMG\n\nCommit: `%s`\n' "$GITHUB_SHA" > "$notes"
            gh release create "$tag" \
              --draft \
              --title "silverwing $tag" \
              --generate-notes \
              --notes-file "$notes"
          fi

      - name: Show draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,url --jq '"tag=\(.tagName) draft=\(.isDraft) url=\(.url)"'

  windows:
    name: Windows packages
    needs: [verify, prepare-release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset (MSI)
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wixBin)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
          }
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
            throw "WiX bin directory not found: $wixBin"
          }
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build Windows distributables
        run: .\scripts\build-windows.ps1
        shell: pwsh
        env:
          SILVERWING_RELEASE_SKIP_TESTS: "true"
          SILVERWING_RELEASE_SKIP_UNSTABLE_GIT_TESTS: "true"

      - name: Stage Windows release assets
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path 'build.gradle.kts' -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $out = 'dist\windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $portable = Get-ChildItem 'desktop\build\compose\binaries\main\zip\*-portable.zip' | Select-Object -First 1
          if (-not $portable) { throw 'Portable zip not found' }
          Copy-Item $portable.FullName (Join-Path $out "silverwing-$version-windows-portable.zip")

          $exe = Get-ChildItem 'desktop\build\compose\binaries\main\exe\*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'EXE installer not found' }
          Copy-Item $exe.FullName (Join-Path $out "silverwing-$version-windows-setup.exe")

          $msi = Get-ChildItem 'desktop\build\compose\binaries\main\msi\*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer not found' }
          Copy-Item $msi.FullName (Join-Path $out "silverwing-$version-windows.msi")

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Get-ChildItem $out | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows packages to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem 'dist\windows' -File | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'No Windows packages staged' }
          gh release upload "$env:GITHUB_REF_NAME" @files --clobber
          gh release view "$env:GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name) \(.size)"'

  macos:
    name: macOS packages
    needs: [verify, prepare-release]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS distributables
        env:
          SILVERWING_RELEASE_SKIP_UNSTABLE_GIT_TESTS: "true"
        run: |
          # These files may be checked out with CRLF from a Windows workspace.
          # Normalize them before executing them on the macOS runner.
          perl -pi -e 's/\r$//' ./gradlew ./scripts/build-macos.sh
          chmod +x ./gradlew ./scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Show macOS packaging diagnostics
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for log in desktop/build/compose/logs/createDistributable/*-err.txt desktop/build/compose/logs/createDistributable/*-out.txt; do
            echo "===== $log ====="
            cat "$log"
          done

      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*version *= *"\([^"]*\)".*/\1/p' build.gradle.kts | head -n1)
          mkdir -p dist/macos
          dmg=$(ls desktop/build/compose/binaries/main/dmg/*.dmg | head -n1)
          cp "$dmg" "dist/macos/silverwing-${version}-macos.dmg"
          ls -la dist/macos

      - name: Upload macOS packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/macos/*)
          [ ${#files[@]} -gt 0 ] || { echo 'No macOS packages staged' >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name) \(.size)"'

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify staged release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" --json isDraft,assets --jq '"draft=\(.isDraft)", (.assets[] | "  \(.name) \(.size) bytes")'
          names=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for suffix in -windows-portable.zip -windows-setup.exe -windows.msi -macos.dmg; do
            grep -q -- "$suffix\$" <<< "$names" || {
              echo "Release $tag is missing an asset matching *$suffix" >&2
              exit 1
            }
          done

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,url --jq '"published tag=\(.tagName) draft=\(.isDraft) url=\(.url)"'
