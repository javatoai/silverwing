<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Silverwing Go 与 MyGO 技术架构</title>
  <desc id="desc">架构示意图：MyGO 桌面界面在同一进程中通过 Snapshot 和 Dispatch 调用 application，再连接 domain 及工作区、资料、编辑器、媒体、任务操作和集成模块。storage 管理 home 配置和任务 manifest；executable 与 process 适配外部 Git、Codex、Meegle 和飞书 CLI。主路径不经过 HTTP、JVM 或 WebView。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#547A9D"/></marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#138A9B"/></marker>
  </defs>
  <rect width="1400" height="940" fill="#F4F8FC"/>
  <text x="70" y="76" fill="#173858" font-size="38" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">Silverwing 技术架构与职责边界</text>
  <text x="70" y="118" fill="#526B82" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">原生桌面主路径在单一进程中完成；团队工具通过本机外部 CLI 接入。</text>
  <rect x="1024" y="48" width="306" height="48" rx="24" fill="#E7EEF6"/>
  <text x="1177" y="80" text-anchor="middle" fill="#486580" font-size="22" font-weight="600" font-family="Segoe UI, Microsoft YaHei, sans-serif">结构示意 · 非界面截图</text>

