  <text x="92" y="650" fill="#38536C" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">用户 home 配置分片、恢复日志与任务 manifest</text>
  <text x="92" y="682" fill="#526B82" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">锁定写入并通过原子替换保护数据</text>

