<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">资料同步到飞书</title>
<desc id="desc">同步由用户从本地资料发起，授权、目标和结果均有独立步骤。结构/流程示意，不是界面截图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8298af"/></marker></defs>
<rect width="1400" height="760" fill="#f7f9fc"/>
<text x="74" y="78" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#173f6b">资料同步到飞书</text>
<text x="76" y="121" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#52667c">同步由用户从本地资料发起，授权、目标和结果均有独立步骤</text>
<rect x="1002" y="142" width="322" height="42" rx="21" fill="#e8eef6"/>
<text x="1163" y="170" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#4b6076">结构/流程示意 · 非界面截图</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><path d="M372 365.0 H388" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M691 365.0 H707" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M1010 365.0 H1026" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><g class="card" data-card="选择资料"><rect data-frame="true" x="76" y="222" width="289" height="286" rx="22" fill="#eaf2ff" stroke="#3478c9" stroke-width="2"/><rect x="76" y="222" width="289" height="12" rx="6" fill="#3478c9"/><text x="220.5" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#174b83"><tspan x="220.5" dy="0">选择资料</tspan></text><text x="220.5" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="220.5" dy="0">从本地资料树</tspan><tspan x="220.5" dy="30">选择文件范围</tspan><tspan x="220.5" dy="30">按范围补齐依赖</tspan></text></g><g class="card" data-card="授权与目标"><rect data-frame="true" x="395" y="222" width="289" height="286" rx="22" fill="#e7f7f6" stroke="#159a9a" stroke-width="2"/><rect x="395" y="222" width="289" height="12" rx="6" fill="#159a9a"/><text x="539.5" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#176a70"><tspan x="539.5" dy="0">授权与目标</tspan></text><text x="539.5" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="539.5" dy="0">检查 Lark 授权</tspan><tspan x="539.5" dy="30">选择目标位置</tspan><tspan x="539.5" dy="30">确认同步范围</tspan></text></g><g class="card" data-card="显式同步"><rect data-frame="true" x="714" y="222" width="289" height="286" rx="22" fill="#fff4df" stroke="#df9b26" stroke-width="2"/><rect x="714" y="222" width="289" height="12" rx="6" fill="#df9b26"/><text x="858.5" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#87520d"><tspan x="858.5" dy="0">显式同步</tspan></text><text x="858.5" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="858.5" dy="0">用户发起同步</tspan><tspan x="858.5" dy="30">提交所选资料</tspan><tspan x="858.5" dy="30">显示执行状态</tspan></text></g><g class="card" data-card="结果与重试"><rect data-frame="true" x="1033" y="222" width="289" height="286" rx="22" fill="#eef0ff" stroke="#6d72c8" stroke-width="2"/><rect x="1033" y="222" width="289" height="12" rx="6" fill="#6d72c8"/><text x="1177.5" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#424b95"><tspan x="1177.5" dy="0">结果与重试</tspan></text><text x="1177.5" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="1177.5" dy="0">查看逐项结果</tspan><tspan x="1177.5" dy="30">修正后重新同步</tspan><tspan x="1177.5" dy="30">保留局部结果</tspan></text></g></g>
<rect x="76" y="552" width="1248" height="98" rx="18" fill="#ffffff" stroke="#d7e1eb" stroke-width="2"/>
<circle cx="108" cy="601" r="9" fill="#159a9a"/>
<text x="700" y="588" text-anchor="middle" font-size="22" font-weight="500" fill="#3e5267"><tspan x="700" dy="0">用户显式选择单文件或全量资料；按实际计划核对审批与结果。</tspan></text>
<text x="76" y="710" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#73869a">Silverwing 知识库 · 基于当前代码与已实现功能</text>
