name: silverwing release packages

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          product_version=$(sed -n 's/.*version *= *"\([^"]*\)".*/\1/p' build.gradle.kts | head -n1)
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$product_version"
          test "$tag_version" = "$product_version" || {
            echo "Release tag $GITHUB_REF_NAME does not match product version $product_version" >&2
            exit 1
          }
      - name: Test and compile desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean test :desktop:compileKotlin -PskipHostedGitIntegrationTests
      - name: Test and compile desktop (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          perl -pi -e 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew clean test :desktop:compileKotlin -PskipHostedGitIntegrationTests

  windows:
    name: Windows packages
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset (MSI)
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wixBin)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
          }
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
            throw "WiX bin directory not found: $wixBin"
          }
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build Windows distributables
        run: .\scripts\build-windows.ps1
        shell: pwsh
        env:
          SILVERWING_RELEASE_SKIP_UNSTABLE_GIT_TESTS: "true"

      - name: Stage Windows release assets
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path 'build.gradle.kts' -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $out = 'dist\windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $portable = Get-ChildItem 'desktop\build\compose\binaries\main\zip\*-portable.zip' | Select-Object -First 1
          if (-not $portable) { throw 'Portable zip not found' }
          Copy-Item $portable.FullName (Join-Path $out "silverwing-$version-windows-portable.zip")

          $exe = Get-ChildItem 'desktop\build\compose\binaries\main\exe\*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'EXE installer not found' }
          Copy-Item $exe.FullName (Join-Path $out "silverwing-$version-windows-setup.exe")

          $msi = Get-ChildItem 'desktop\build\compose\binaries\main\msi\*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer not found' }
          Copy-Item $msi.FullName (Join-Path $out "silverwing-$version-windows.msi")

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Get-ChildItem $out | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silverwing-windows-packages
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS packages
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS distributables
        env:
          SILVERWING_RELEASE_SKIP_UNSTABLE_GIT_TESTS: "true"
        run: |
          # These files may be checked out with CRLF from a Windows workspace.
          # Normalize them before executing them on the macOS runner.
          perl -pi -e 's/\r$//' ./gradlew ./scripts/build-macos.sh
          chmod +x ./gradlew ./scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Show macOS packaging diagnostics
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for log in desktop/build/compose/logs/createDistributable/*-err.txt desktop/build/compose/logs/createDistributable/*-out.txt; do
            echo "===== $log ====="
            cat "$log"
          done

      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*version *= *"\([^"]*\)".*/\1/p' build.gradle.kts | head -n1)
          mkdir -p dist/macos
          dmg=$(ls desktop/build/compose/binaries/main/dmg/*.dmg | head -n1)
          cp "$dmg" "dist/macos/silverwing-${version}-macos.dmg"
          ls -la dist/macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silverwing-macos-packages
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: silverwing-windows-packages
          path: release-assets

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: silverwing-macos-packages
          path: release-assets

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=silverwing ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=continuous" >> "$GITHUB_OUTPUT"
            echo "name=Continuous build (${short_sha})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la release-assets

      - name: Point continuous tag at the packaged commit
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only this prerelease tag is mutable; version tags never enter this step.
          api_root="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git"
          github_api() {
            curl --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          status=$(github_api --output /dev/null --write-out '%{http_code}' \
            "${api_root}/ref/tags/continuous")
          case "$status" in
            200)
              github_api --fail-with-body --request PATCH \
                "${api_root}/refs/tags/continuous" \
                --data "{\"sha\":\"${GITHUB_SHA}\",\"force\":true}"
              ;;
            404)
              github_api --fail-with-body --request POST "${api_root}/refs" \
                --data "{\"ref\":\"refs/tags/continuous\",\"sha\":\"${GITHUB_SHA}\"}"
              ;;
            *)
              echo "Cannot inspect continuous tag (HTTP ${status}); refusing to publish." >&2
              exit 1
              ;;
          esac

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          body: |
            自动构建 silverwing 桌面产物。

            - **Windows**：绿色 portable zip、Setup EXE、MSI
            - **macOS**：DMG

            Commit: `${{ github.sha }}`
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
