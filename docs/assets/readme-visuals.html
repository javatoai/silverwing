<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Silverwing README visuals</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      --canvas: #f4f7fb;
      --ink: #151d2e;
      --wing: #6a6c6b;
      --edge: #cbd5e3;
      --shadow: rgb(27 49 83 / 18%);
    }
    body[data-theme="dark"] {
      --canvas: #0c111b;
      --ink: #edf2fa;
      --wing: #b9c5d6;
      --edge: #34435b;
      --shadow: rgb(0 0 0 / 58%);
    }
    .asset { display: none; }
    body[data-asset="brand"] .brand { display: flex; }
    body[data-asset="banner"] .banner { display: block; }
    .brand {
      width: 1280px;
      height: 280px;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }
    .wing {
      flex: 0 0 228px;
      height: 228px;
      background: var(--wing);
      mask: url("../../internal/desktop/assets/app-icon.png") center / contain no-repeat;
    }
    .wordmark {
      color: var(--ink);
      font: 600 190px/1 "Segoe UI", sans-serif;
      letter-spacing: -0.035em;
      padding-bottom: 12px;
    }
    .banner {
      position: relative;
      width: 2560px;
      height: 1440px;
      overflow: hidden;
      background: var(--canvas);
    }
    .window {
      position: absolute;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 32px 72px var(--shadow), 0 0 0 1px var(--edge);
    }
    .window img { display: block; width: 100%; height: auto; }
    .workspace { left: 112px; top: 80px; width: 82%; }
    .review { right: 72px; bottom: 72px; width: 42%; }
  </style>
</head>
<body>
  <div class="asset brand" role="img" aria-label="Silverwing">
    <span class="wing" aria-hidden="true"></span>
    <span class="wordmark">Silverwing</span>
  </div>
  <div class="asset banner">
    <div class="window workspace">
      <img id="workspace" src="readme-hero-light.png" alt="Silverwing task workspace">
    </div>
    <div class="window review">
      <img src="readme-git-review.png" alt="Silverwing side-by-side Git review">
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const theme = params.get("theme") === "dark" ? "dark" : "light";
    document.body.dataset.theme = theme;
    document.body.dataset.asset = params.get("asset") === "brand" ? "brand" : "banner";
    document.getElementById("workspace").src = `readme-hero-${theme}.png`;
  </script>
</body>
</html>
