<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">扩展管理生命周期</title>
<desc id="desc">扩展来源和目录在本机管理；安装或更新后按类型配置并核对状态。结构/流程示意，不是界面截图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8298af"/></marker></defs>
<rect width="1400" height="760" fill="#f7f9fc"/>
<text x="74" y="78" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#173f6b">扩展管理生命周期</text>
<text x="76" y="121" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#52667c">扩展来源和目录在本机管理；安装或更新后按类型配置并核对状态</text>
<rect x="1002" y="142" width="322" height="42" rx="21" fill="#e8eef6"/>
<text x="1163" y="170" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#4b6076">结构/流程示意 · 非界面截图</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><path d="M327 365.0 H335" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M573 365.0 H581" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M819 365.0 H827" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M1065 365.0 H1073" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><g class="card" data-card="发现来源"><rect data-frame="true" x="96" y="222" width="224" height="286" rx="22" fill="#eaf2ff" stroke="#3478c9" stroke-width="2"/><rect x="96" y="222" width="224" height="12" rx="6" fill="#3478c9"/><text x="208.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#174b83"><tspan x="208.0" dy="0">发现来源</tspan></text><text x="208.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="208.0" dy="0">选择扩展类型</tspan><tspan x="208.0" dy="30">核对已配置来源</tspan><tspan x="208.0" dy="30">读取扩展信息</tspan></text></g><g class="card" data-card="预览"><rect data-frame="true" x="342" y="222" width="224" height="286" rx="22" fill="#e7f7f6" stroke="#159a9a" stroke-width="2"/><rect x="342" y="222" width="224" height="12" rx="6" fill="#159a9a"/><text x="454.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#176a70"><tspan x="454.0" dy="0">预览</tspan></text><text x="454.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="454.0" dy="0">核对名称版本</tspan><tspan x="454.0" dy="30">查看将变更内容</tspan><tspan x="454.0" dy="30">确认来源</tspan></text></g><g class="card" data-card="安装或更新"><rect data-frame="true" x="588" y="222" width="224" height="286" rx="22" fill="#fff4df" stroke="#df9b26" stroke-width="2"/><rect x="588" y="222" width="224" height="12" rx="6" fill="#df9b26"/><text x="700.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#87520d"><tspan x="700.0" dy="0">安装或更新</tspan></text><text x="700.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="700.0" dy="0">用户显式确认</tspan><tspan x="700.0" dy="30">按类型执行写入</tspan><tspan x="700.0" dy="30">核对工具结果</tspan></text></g><g class="card" data-card="按需配置"><rect data-frame="true" x="834" y="222" width="224" height="286" rx="22" fill="#eef0ff" stroke="#6d72c8" stroke-width="2"/><rect x="834" y="222" width="224" height="12" rx="6" fill="#6d72c8"/><text x="946.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#424b95"><tspan x="946.0" dy="0">按需配置</tspan></text><text x="946.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="946.0" dy="0">插件核对安装状态</tspan><tspan x="946.0" dy="30">MCP 开关与权限</tspan><tspan x="946.0" dy="30">以实际入口为准</tspan></text></g><g class="card" data-card="核对状态"><rect data-frame="true" x="1080" y="222" width="224" height="286" rx="22" fill="#eaf6ec" stroke="#4f9c69" stroke-width="2"/><rect x="1080" y="222" width="224" height="12" rx="6" fill="#4f9c69"/><text x="1192.0" y="276" text-anchor="middle" font-size="26" font-weight="700" fill="#306d43"><tspan x="1192.0" dy="0">核对状态</tspan></text><text x="1192.0" y="329" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="1192.0" dy="0">查看安装状态</tspan><tspan x="1192.0" dy="30">检查配置结果</tspan><tspan x="1192.0" dy="30">必要时重试</tspan></text></g></g>
<rect x="76" y="552" width="1248" height="98" rx="18" fill="#ffffff" stroke="#d7e1eb" stroke-width="2"/>
<circle cx="108" cy="601" r="9" fill="#159a9a"/>
<text x="700" y="588" text-anchor="middle" font-size="22" font-weight="500" fill="#3e5267"><tspan x="700" dy="0">来源读取与安装/更新分开呈现；具体配置方式以扩展类型和入口为准。</tspan></text>
<text x="76" y="710" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#73869a">Silverwing 知识库 · 基于当前代码与已实现功能</text>
