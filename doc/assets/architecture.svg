  <rect x="640" y="555" width="700" height="12" rx="6" fill="#D99A27"/>
  <text x="672" y="609" fill="#805914" font-size="27" font-weight="700" font-family="Segoe UI, Microsoft YaHei, sans-serif">executable + process · 外部进程适配</text>
  <text x="672" y="650" fill="#5E5138" font-size="23" font-family="Segoe UI, Microsoft YaHei, sans-serif">解析工具路径、来源与环境；支持超时、取消和清理子进程</text>
  <text x="672" y="682" fill="#5E5138" font-size="22" font-family="Segoe UI, Microsoft YaHei, sans-serif">具体 CLI、账号和团队凭据由用户环境提供</text>

