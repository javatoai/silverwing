<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
<title id="title">开发验证到发布资产</title>
<desc id="desc">普通 CI 工件与版本 Tag 触发的发布流程不同，不预设发布时间。开发者本地检查后，普通 CI 和精确版本 Tag 进入互相独立的构建分支。结构/流程示意，不是界面截图。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8298af"/></marker></defs>
<rect width="1400" height="950" fill="#f7f9fc"/>
<text x="74" y="78" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#173f6b">开发验证到发布资产</text>
<text x="76" y="121" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#52667c">普通 CI 工件与版本 Tag 触发的发布流程不同，不预设发布时间</text>
<rect x="1002" y="142" width="322" height="42" rx="21" fill="#e8eef6"/>
<text x="1163" y="170" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#4b6076">结构/流程示意 · 非界面截图</text>
<rect x="76" y="377" width="1248" height="186" rx="18" fill="#f0f5fc" stroke="#c9d9ec" stroke-width="2"/>
<rect x="76" y="600" width="1248" height="218" rx="18" fill="#eff8f7" stroke="#c6e2df" stroke-width="2"/>
<text x="104" y="454" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#3478c9"><tspan x="104">普通 CI</tspan><tspan x="104" dy="29">工件分支</tspan></text>
<text x="104" y="682" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#159a9a"><tspan x="104">版本 Tag</tspan><tspan x="104" dy="29">发布分支</tspan></text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><path d="M610 317 V346 H399 V397" fill="none" stroke="#3478c9" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 317 V338 H1290 V587 H356 V617" fill="none" stroke="#159a9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M532 478.0 H557" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M823 478.0 H848" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M478 714.0 H488" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M732 714.0 H742" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><path d="M986 714.0 H996" fill="none" stroke="#8298af" stroke-width="3" marker-end="url(#arrow)"/><g class="card" data-card="开发者本地检查"><rect data-frame="true" x="500" y="194" width="400" height="123" rx="20" fill="#ffffff" stroke="#6d72c8" stroke-width="2"/><rect x="500" y="194" width="400" height="10" rx="5" fill="#6d72c8"/><text x="700" y="239" text-anchor="middle" font-size="26" font-weight="700" fill="#424b95"><tspan x="700" dy="0">开发者本地检查</tspan></text><text x="700" y="273" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="700" dy="0">本地验证与构建检查</tspan><tspan x="700" dy="26">不构成发布触发条件</tspan></text></g><g class="card" data-card="CI 触发"><rect data-frame="true" x="274" y="408" width="250" height="140" rx="18" fill="#eaf2ff" stroke="#3478c9" stroke-width="2"/><rect x="274" y="408" width="250" height="10" rx="5" fill="#3478c9"/><text x="399.0" y="447" text-anchor="middle" font-size="24" font-weight="700" fill="#174b83"><tspan x="399.0" dy="0">CI 触发</tspan></text><text x="399.0" y="484" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="399.0" dy="0">push / PR / 手动</tspan></text></g><g class="card" data-card="普通平台构建"><rect data-frame="true" x="565" y="408" width="250" height="140" rx="18" fill="#e7f7f6" stroke="#159a9a" stroke-width="2"/><rect x="565" y="408" width="250" height="10" rx="5" fill="#159a9a"/><text x="690.0" y="447" text-anchor="middle" font-size="24" font-weight="700" fill="#176a70"><tspan x="690.0" dy="0">普通平台构建</tspan></text><text x="690.0" y="484" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="690.0" dy="0">Windows 便携 ZIP</tspan><tspan x="690.0" dy="25">macOS DMG</tspan></text></g><g class="card" data-card="Artifact"><rect data-frame="true" x="856" y="408" width="250" height="140" rx="18" fill="#fff4df" stroke="#df9b26" stroke-width="2"/><rect x="856" y="408" width="250" height="10" rx="5" fill="#df9b26"/><text x="981.0" y="447" text-anchor="middle" font-size="24" font-weight="700" fill="#87520d"><tspan x="981.0" dy="0">Artifact</tspan></text><text x="981.0" y="484" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="981.0" dy="0">上传构建工件</tspan><tspan x="981.0" dy="25">保留 14 天</tspan></text></g><g class="card" data-card="精确版本 Tag"><rect data-frame="true" x="241" y="630" width="230" height="168" rx="18" fill="#fff4df" stroke="#df9b26" stroke-width="2"/><rect x="241" y="630" width="230" height="10" rx="5" fill="#df9b26"/><text x="356.0" y="669" text-anchor="middle" font-size="24" font-weight="700" fill="#87520d"><tspan x="356.0" dy="0">精确版本 Tag</tspan></text><text x="356.0" y="706" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="356.0" dy="0">v + 产品版本号</tspan><tspan x="356.0" dy="25">必须完全匹配</tspan><tspan x="356.0" dy="25">触发发布工作流</tspan></text></g><g class="card" data-card="两平台构建"><rect data-frame="true" x="495" y="630" width="230" height="168" rx="18" fill="#eef0ff" stroke="#6d72c8" stroke-width="2"/><rect x="495" y="630" width="230" height="10" rx="5" fill="#6d72c8"/><text x="610.0" y="669" text-anchor="middle" font-size="24" font-weight="700" fill="#424b95"><tspan x="610.0" dy="0">两平台构建</tspan></text><text x="610.0" y="706" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="610.0" dy="0">Windows ZIP</tspan><tspan x="610.0" dy="25">Setup EXE / MSI</tspan><tspan x="610.0" dy="25">macOS DMG</tspan></text></g><g class="card" data-card="资产完整性校验"><rect data-frame="true" x="749" y="630" width="230" height="168" rx="18" fill="#eaf6ec" stroke="#4f9c69" stroke-width="2"/><rect x="749" y="630" width="230" height="10" rx="5" fill="#4f9c69"/><text x="864.0" y="669" text-anchor="middle" font-size="24" font-weight="700" fill="#306d43"><tspan x="864.0" dy="0">资产完整性校验</tspan></text><text x="864.0" y="706" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="864.0" dy="0">校验完整资产集</tspan><tspan x="864.0" dy="25">确认四个版本包</tspan></text></g><g class="card" data-card="Draft 与发布"><rect data-frame="true" x="1003" y="630" width="230" height="168" rx="18" fill="#eaf2ff" stroke="#3478c9" stroke-width="2"/><rect x="1003" y="630" width="230" height="10" rx="5" fill="#3478c9"/><text x="1118.0" y="669" text-anchor="middle" font-size="24" font-weight="700" fill="#174b83"><tspan x="1118.0" dy="0">Draft 与发布</tspan></text><text x="1118.0" y="706" text-anchor="middle" font-size="22" font-weight="400" fill="#32465b"><tspan x="1118.0" dy="0">先创建 Draft</tspan><tspan x="1118.0" dy="25">上传版本资产</tspan><tspan x="1118.0" dy="25">校验后正式发布</tspan></text></g></g>
<rect x="76" y="837" width="1248" height="52" rx="16" fill="#ffffff" stroke="#d7e1eb" stroke-width="2"/>
<text x="700" y="871" text-anchor="middle" font-size="22" font-weight="500" fill="#3e5267"><tspan x="700" dy="0">两类触发路径互相独立；普通 CI 不会顺序进入版本发布流程。</tspan></text>
<text x="76" y="923" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" fill="#73869a">Silverwing 知识库 · 基于当前代码与已实现功能</text>
</svg>